[project]
name = "forecast-explainer"
version = "0.1.0"
description = "Forecast-to-Insight ML System: Classical ML forecasting, HA serving, automated drift detection, shadow retraining, and GenAI incident explainer."
authors = [{name = "ML Systems Engineer", email = "dev@example.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.5.0",
    "statsmodels>=0.14.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "typer>=0.12.0",
    "rich>=13.9.0",
    "pyyaml>=6.0"
]

[project.scripts]
forecast-cli = "src.cli:app"

[tool.poetry]
packages = [{include = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
pytest-asyncio = ">=0.24.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
