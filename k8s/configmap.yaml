apiVersion: v1
kind: ConfigMap
metadata:
  name: forecast-config
  namespace: forecast-mlops
  labels:
    app.kubernetes.io/name: forecast-explainer
    app.kubernetes.io/component: configuration
data:
  HOST: "0.0.0.0"
  PORT: "8000"
  VERSION: "3"
  ANTHROPIC_MODEL: "claude-haiku-5-5"
  OPENAI_MODEL: "gpt-6-luna"
  GEMINI_MODEL: "gemini-3.8-flash-lite"
  SERVING_TIMEOUT: "2.0"
  DRIFT_PSI_CRITICAL: "0.20"
  DRIFT_PSI_WARNING: "0.10"
  LOG_LEVEL: "INFO"
