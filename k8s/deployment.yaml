apiVersion: apps/v1
kind: Deployment
metadata:
  name: forecast-serving
  namespace: forecast-mlops
  labels:
    app.kubernetes.io/name: forecast-serving
    app.kubernetes.io/component: inference-engine
    app.kubernetes.io/part-of: forecast-to-insight
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: forecast-serving
  template:
    metadata:
      labels:
        app: forecast-serving
        app.kubernetes.io/name: forecast-serving
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - forecast-serving
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: forecast-serving
      containers:
        - name: serving
          image: forecast-explainer:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "src.serving.app:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http-serving
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: forecast-config
            - secretRef:
                name: forecast-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: http-serving
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http-serving
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http-serving
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          volumeMounts:
            - name: registry-storage
              mountPath: /app/models/registry
      volumes:
        - name: registry-storage
          emptyDir: {}
