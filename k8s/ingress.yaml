apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forecast-ingress
  namespace: forecast-mlops
  labels:
    app.kubernetes.io/name: forecast-explainer
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "10"
    nginx.ingress.kubernetes.io/limit-rps: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - forecast.internal.domain
      secretName: forecast-tls-secret
  rules:
    - host: forecast.internal.domain
      http:
        paths:
          - path: /api/v1/forecast
            pathType: Prefix
            backend:
              service:
                name: forecast-serving
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: forecast-serving
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forecast-ui
                port:
                  number: 3000
