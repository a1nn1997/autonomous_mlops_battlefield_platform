name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  python-test-suite:
    name: Backend ML Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies (Clean Environment - No .venv)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio anyio httpx
          pip install -e .

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v

  frontend-build-check:
    name: Next.js Frontend Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: ./ui
        run: npm ci

      - name: Build Next.js Production Bundle
        working-directory: ./ui
        env:
          DETERMINISTIC_PROD_MODE: "true"
        run: npm run build
